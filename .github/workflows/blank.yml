
name: Android APK Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PathRunner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_ROOT=""

          while IFS= read -r -d '' file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/gradlew" ]; then
              GRADLE_ROOT="$candidate"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' -print0
          )

          if [ -z "$GRADLE_ROOT" ]; then
            while IFS= read -r -d '' file; do
              candidate="$(dirname "$file")"
              GRADLE_ROOT="$candidate"
              break
            done < <(
              find . -type f -name gradlew \
                -not -path '*/.gradle/*' -print0
            )
          fi

          if [ -z "$GRADLE_ROOT" ]; then
            echo "::error::Gradle wrapper not found."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "GRADLE_ROOT=$GRADLE_ROOT" >> "$GITHUB_ENV"

          echo "Gradle project: $GRADLE_ROOT"

          ls -la "$GRADLE_ROOT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GRADLE_ROOT"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PathRunner-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
